<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora AI Assistant</title>

  <style>
    :root {
      --bg: #090b12;
      --sidebar: #0d1019;
      --panel: #121622;
      --panel-hover: #191e2c;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f2f4fa;
      --muted: #9299ad;
      --accent: #8b7cff;
      --accent-light: #a69aff;
      --success: #55d6a7;
      --danger: #ff7777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Sidebar */

    .sidebar {
      width: 270px;
      min-width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      transition: transform 0.25s ease;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 8px 25px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 19px;
      background: linear-gradient(135deg, #8b7cff, #5e49db);
      box-shadow: 0 5px 24px rgba(139, 124, 255, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.7px;
    }

    .brand-name span {
      color: var(--accent-light);
    }

    .new-chat-btn {
      width: 100%;
      border: 1px solid rgba(139, 124, 255, 0.3);
      border-radius: 12px;
      padding: 12px;
      background: rgba(139, 124, 255, 0.1);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      transition: 0.2s;
      margin-bottom: 25px;
    }

    .new-chat-btn:hover {
      background: rgba(139, 124, 255, 0.19);
      border-color: var(--accent);
    }

    .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 0 10px 12px;
    }

    .history-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 9px;
      color: var(--muted);
      margin-bottom: 4px;
      cursor: pointer;
      position: relative;
      border: 1px solid transparent;
    }

    .history-item:hover,
    .history-item.active {
      color: var(--text);
      background: var(--panel);
    }

    .history-item.active {
      border-color: var(--border);
    }

    .history-icon {
      flex-shrink: 0;
      font-size: 15px;
    }

    .history-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .history-menu-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      width: 25px;
      height: 25px;
      border-radius: 6px;
      opacity: 0;
      flex-shrink: 0;
    }

    .history-item:hover .history-menu-btn,
    .history-menu-btn:focus {
      opacity: 1;
    }

    .history-menu-btn:hover {
      background: var(--panel-hover);
      color: white;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 12px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      border-radius: 9px;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }

    .sidebar-link:hover {
      color: var(--text);
      background: var(--panel);
    }

    .danger-link:hover {
      color: var(--danger);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 7px 2px;
      margin-top: 8px;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b7cff, #5544bc);
      color: white;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-size: 12px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 165px;
    }

    .user-status {
      color: var(--success);
      font-size: 11px;
      margin-top: 3px;
    }

    /* Main layout */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(
          ellipse at 50% -15%,
          rgba(105, 85, 210, 0.09),
          transparent 50%
        ),
        var(--bg);
    }

    .topbar {
      min-height: 72px;
      padding: 0 27px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 15px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      width: 37px;
      height: 37px;
      border-radius: 10px;
    }

    .page-title {
      font-size: 16px;
      font-weight: 700;
    }

    .model-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(85, 214, 167, 0.3);
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 9px 13px;
      border-radius: 9px;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--panel-hover);
      border-color: rgba(255, 255, 255, 0.17);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-light);
      border-color: var(--accent-light);
    }

    /* Chat */

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat-content {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 36px 25px 25px;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 0 70px;
    }

    .welcome-icon {
      width: 66px;
      height: 66px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(
        145deg,
        rgba(139, 124, 255, 0.23),
        rgba(93, 72, 200, 0.12)
      );
      border: 1px solid rgba(139, 124, 255, 0.25);
      font-size: 30px;
      margin-bottom: 24px;
      box-shadow: 0 12px 50px rgba(139, 124, 255, 0.08);
    }

    .welcome h1 {
      font-size: clamp(27px, 4vw, 39px);
      letter-spacing: -1.3px;
      line-height: 1.2;
      margin-bottom: 13px;
    }

    .welcome h1 span {
      color: var(--accent-light);
    }

    .welcome p {
      max-width: 480px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
      width: 100%;
      max-width: 580px;
      margin-top: 35px;
    }

    .suggestion {
      text-align: left;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(18, 22, 34, 0.8);
      color: var(--text);
      transition: 0.2s;
    }

    .suggestion:hover {
      background: var(--panel-hover);
      border-color: rgba(139, 124, 255, 0.4);
      transform: translateY(-2px);
    }

    .suggestion-icon {
      font-size: 18px;
      display: block;
      margin-bottom: 11px;
    }

    .suggestion strong {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .suggestion span:last-child {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .message {
      display: flex;
      gap: 13px;
      margin-bottom: 29px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 33px;
      height: 33px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    .user-message .message-avatar {
      background: #24293a;
    }

    .assistant-message .message-avatar {
      background: linear-gradient(135deg, #8b7cff, #5544bc);
    }

    .message-body {
      min-width: 0;
      flex: 1;
    }

    .message-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 5px 0 10px;
    }

    .message-name {
      font-size: 12px;
      font-weight: 700;
    }

    .message-time {
      color: var(--muted);
      font-size: 10px;
    }

    .message-text {
      color: #dce0eb;
      font-size: 14px;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message-text p {
      margin-bottom: 12px;
    }

    .message-text p:last-child {
      margin-bottom: 0;
    }

    .message-text h1,
    .message-text h2,
    .message-text h3 {
      color: white;
      margin: 16px 0 9px;
    }

    .message-text ul,
    .message-text ol {
      padding-left: 23px;
      margin: 9px 0;
    }

    .message-text li {
      margin-bottom: 5px;
    }

    .message-text strong {
      color: white;
    }

    .message-text code {
      background: #202538;
      border-radius: 5px;
      padding: 2px 5px;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
    }

    .code-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin: 14px 0;
      background: #080a10;
    }

    .code-header {
      background: #151927;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      color: var(--muted);
      font-size: 11px;
    }

    .copy-code-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 10px;
    }

    .copy-code-btn:hover {
      color: white;
    }

    .code-block pre {
      padding: 15px;
      overflow-x: auto;
      color: #dce0eb;
      font-size: 12px;
      line-height: 1.8;
      font-family: Consolas, Monaco, monospace;
      white-space: pre;
    }

    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .message-action {
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    .message-action:hover {
      color: white;
      background: var(--panel);
      border-color: var(--border);
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 9px 0;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--accent-light);
      border-radius: 50%;
      animation: typing 1.1s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    /* Composer */

    .composer-area {
      padding: 15px 24px 17px;
      background: linear-gradient(
        to top,
        var(--bg) 75%,
        rgba(9, 11, 18, 0.8)
      );
    }

    .composer {
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: #111521;
      border-radius: 17px;
      padding: 13px 14px 10px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.16);
      transition: border-color 0.2s;
    }

    .composer:focus-within {
      border-color: rgba(139, 124, 255, 0.65);
    }

    #messageInput {
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.7;
      padding: 2px 2px 8px;
    }

    #messageInput::placeholder {
      color: #737b91;
    }

    .composer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .composer-hint {
      font-size: 10px;
      color: var(--muted);
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-size: 17px;
      transition: 0.2s;
    }

    .send-btn:hover {
      background: var(--accent-light);
    }

    .disclaimer {
      max-width: 800px;
      margin: 9px auto 0;
      text-align: center;
      font-size: 10px;
      color: #747b8e;
    }

    /* Toast */

    .toast-container {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      max-width: min(360px, calc(100vw - 30px));
      padding: 13px 17px;
      background: #1a2030;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      animation: fadeIn 0.2s ease;
    }

    .toast.error {
      border-color: rgba(255, 119, 119, 0.4);
    }

    .toast.success {
      border-color: rgba(85, 214, 167, 0.4);
    }

    /* Menus and modal */

    .context-menu {
      position: fixed;
      z-index: 80;
      width: 155px;
      background: #171b29;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      display: none;
    }

    .context-menu button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
    }

    .context-menu button:hover {
      background: var(--panel-hover);
    }

    .context-menu .delete-option {
      color: var(--danger);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 90;
      backdrop-filter: blur(5px);
    }

    .modal {
      width: 100%;
      max-width: 400px;
      background: #131725;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 25px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .modal input {
      width: 100%;
      background: #090c14;
      border: 1px solid var(--border);
      color: white;
      border-radius: 9px;
      padding: 12px;
      outline: none;
      margin-bottom: 17px;
    }

    .modal input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .btn-danger {
      background: #d94f61;
      border-color: #d94f61;
      color: white;
    }

    .btn-danger:hover {
      background: #ed6072;
    }

    .sidebar-backdrop {
      display: none;
    }

    /* Responsive */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-105%);
        box-shadow: 15px 0 50px rgba(0, 0, 0, 0.35);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 15;
      }

      .mobile-menu-btn {
        display: block;
      }

      .topbar {
        min-height: 65px;
        padding: 0 14px;
      }

      .page-title {
        font-size: 14px;
      }

      .topbar-actions {
        gap: 6px;
      }

      .topbar-actions .btn {
        padding: 8px 9px;
        font-size: 11px;
      }

      .chat-content {
        padding: 22px 16px;
      }

      .welcome {
        padding: 35px 0 45px;
      }

      .welcome p {
        font-size: 13px;
      }

      .suggestions {
        gap: 8px;
        margin-top: 25px;
      }

      .suggestion {
        padding: 12px;
      }

      .suggestion strong {
        font-size: 12px;
      }

      .suggestion span:last-child {
        font-size: 10px;
      }

      .composer-area {
        padding: 10px 12px 12px;
      }

      .composer-hint {
        font-size: 9px;
      }

      .message {
        gap: 9px;
      }
    }

    @media (max-width: 420px) {
      .topbar-actions .dashboard-btn {
        display: none;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .model-status {
        font-size: 10px;
      }

      .composer-hint {
        max-width: 230px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-icon">N</div>
        <div class="brand-name">Nexora<span>.</span></div>
      </div>

      <button class="new-chat-btn" id="sidebarNewChat">
        <span>＋</span>
        <span>New conversation</span>
      </button>

      <div class="section-label">Your conversations</div>

      <div class="history-list" id="historyList"></div>

      <div class="sidebar-bottom">

        <a class="sidebar-link" href="dashboard.html">
          <span>▦</span>
          <span>Dashboard</span>
        </a>

        <button class="sidebar-link" id="deleteAllBtn">
          <span>⌫</span>
          <span>Delete all conversations</span>
        </button>

        <button class="sidebar-link danger-link" id="logoutBtn">
          <span>↪</span>
          <span>Log out</span>
        </button>

        <div class="user-card">
          <div class="avatar" id="userAvatar">N</div>

          <div class="user-info">
            <div class="user-name" id="userName">Nexora User</div>
            <div class="user-status">● Account connected</div>
          </div>
        </div>

      </div>
    </aside>

    <main class="main">

      <header class="topbar">

        <div class="topbar-left">
          <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            aria-label="Open menu"
          >☰</button>

          <div>
            <div class="page-title">Nexora AI Assistant</div>

            <div class="model-status">
              <span class="status-dot"></span>
              <span id="modelStatus">AI assistant ready</span>
            </div>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="btn" id="topNewChat">＋ New chat</button>
          <a class="btn dashboard-btn" href="dashboard.html">Dashboard ↗</a>
        </div>

      </header>

      <section class="chat-scroll" id="chatScroll">
        <div class="chat-content" id="chatContent"></div>
      </section>

      <footer class="composer-area">

        <form class="composer" id="chatForm">

          <textarea
            id="messageInput"
            placeholder="Ask Nexora anything..."
            rows="1"
            maxlength="12000"
            aria-label="Message"
          ></textarea>

          <div class="composer-bottom">
            <span class="composer-hint">
              Enter to send · Shift + Enter for a new line
            </span>

            <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">
              ↑
            </button>
          </div>

        </form>

        <div class="disclaimer">
          Nexora AI can make mistakes. Check important information.
        </div>

      </footer>

    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="context-menu" id="contextMenu">
    <button id="renameConversationBtn">✎ Rename</button>
    <button class="delete-option" id="deleteConversationBtn">
      ⌫ Delete conversation
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle">Confirm action</h2>
      <p id="modalDescription">Are you sure?</p>

      <input
        id="renameInput"
        type="text"
        maxlength="80"
        placeholder="Conversation name"
        style="display:none"
      >

      <div class="modal-actions">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-danger" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const API_BASE = "/api";
    const SESSION_API = `${API_BASE}/auth/me`;
    const CHAT_API = `${API_BASE}/chat`;
    const LOGOUT_API = `${API_BASE}/auth/logout`;

    const STORAGE_KEY = "nexora_conversations_v1";

    const MAX_CONVERSATIONS = 100;
    const MAX_MESSAGES = 200;

    const historyList = document.getElementById("historyList");
    const chatContent = document.getElementById("chatContent");
    const chatScroll = document.getElementById("chatScroll");
    const messageInput = document.getElementById("messageInput");
    const chatForm = document.getElementById("chatForm");
    const sendBtn = document.getElementById("sendBtn");
    const modelStatus = document.getElementById("modelStatus");

    const sidebar = document.getElementById("sidebar");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");

    const contextMenu = document.getElementById("contextMenu");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalDescription = document.getElementById("modalDescription");
    const modalConfirm = document.getElementById("modalConfirm");
    const modalCancel = document.getElementById("modalCancel");
    const renameInput = document.getElementById("renameInput");

    let conversations = [];
    let activeConversationId = null;
    let menuConversationId = null;
    let modalAction = null;
    let isSending = false;
    let currentUser = null;

    /* General helpers */

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return Date.now().toString(36) +
        Math.random().toString(36).slice(2);
    }

    function showToast(message, type = "success", duration = 3000) {
      const toast = document.createElement("div");

      toast.className = `toast ${type}`;
      toast.textContent = message;

      document.getElementById("toastContainer").appendChild(toast);

      window.setTimeout(() => {
        toast.remove();
      }, duration);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("Copied to clipboard.");
      } catch {
        const textarea = document.createElement("textarea");

        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        const copied = document.execCommand("copy");
        textarea.remove();

        if (copied) {
          showToast("Copied to clipboard.");
        } else {
          showToast("Could not copy. Please select and copy manually.", "error");
        }
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getCurrentTime() {
      return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function closeMobileSidebar() {
      sidebar.classList.remove("open");
      sidebarBackdrop.classList.remove("show");
    }

    function openMobileSidebar() {
      sidebar.classList.add("open");
      sidebarBackdrop.classList.add("show");
    }

    /* Conversation storage */

    function getStorageKey() {
      if (currentUser && currentUser.id) {
        return "nexora_conversations_u" + currentUser.id;
      }
      return STORAGE_KEY;
    }

    function loadConversations() {
      try {
        const key = getStorageKey();
        let saved = localStorage.getItem(key);

        // Fallback: migrate legacy un-isolated storage if user storage is empty
        if (!saved && key !== STORAGE_KEY) {
          saved = localStorage.getItem(STORAGE_KEY);
        }

        if (!saved) {
          conversations = [];
          return;
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          conversations = [];
          return;
        }

        conversations = parsed
          .filter(item =>
            item &&
            typeof item.id === "string" &&
            Array.isArray(item.messages)
          )
          .slice(0, MAX_CONVERSATIONS)
          .map(item => ({
            id: item.id,
            title: String(item.title || "New conversation").slice(0, 80),
            createdAt: item.createdAt || Date.now(),
            updatedAt: item.updatedAt || Date.now(),
            messages: item.messages
              .filter(message =>
                message &&
                ["user", "assistant"].includes(message.role) &&
                typeof message.content === "string"
              )
              .slice(-MAX_MESSAGES)
              .map(message => ({
                role: message.role,
                content: message.content,
                time: message.time || ""
              }))
          }));

      } catch (error) {
        console.error("Could not load conversations:", error);
        conversations = [];
        showToast("Saved conversation history could not be loaded.", "error");
      }
    }

    function saveConversations() {
      try {
        conversations = conversations
          .sort((a, b) => b.updatedAt - a.updatedAt)
          .slice(0, MAX_CONVERSATIONS);

        localStorage.setItem(getStorageKey(), JSON.stringify(conversations));

        renderHistory();
      } catch (error) {
        console.error("Could not save conversations:", error);
        showToast("Could not save conversation history in this browser.", "error");
      }
    }

    function getActiveConversation() {
      return conversations.find(
        conversation => conversation.id === activeConversationId
      ) || null;
    }

    function createConversation() {
      if (isSending) {
        showToast("Please wait for the current response to finish.", "error");
        return;
      }

      const conversation = {
        id: makeId(),
        title: "New conversation",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        messages: []
      };

      conversations.unshift(conversation);
      activeConversationId = conversation.id;

      saveConversations();
      renderChat();
      messageInput.focus();

      closeMobileSidebar();
    }

    function selectConversation(id) {
      if (isSending) {
        showToast("Wait until the current response finishes.", "error");
        return;
      }

      const conversation = conversations.find(item => item.id === id);

      if (!conversation) return;

      activeConversationId = id;

      renderHistory();
      renderChat();

      closeMobileSidebar();
    }

    function deleteConversation(id) {
      conversations = conversations.filter(item => item.id !== id);

      if (activeConversationId === id) {
        activeConversationId = null;
      }

      saveConversations();

      if (!activeConversationId || !getActiveConversation()) {
        const newest = conversations[0];

        if (newest) {
          activeConversationId = newest.id;
        } else {
          createConversation();
          return;
        }
      }

      renderChat();
      showToast("Conversation deleted.");
    }

    function renameConversation(id, newTitle) {
      const conversation = conversations.find(item => item.id === id);

      if (!conversation) return;

      const title = newTitle.trim();

      if (!title) {
        showToast("Please enter a conversation name.", "error");
        return;
      }

      conversation.title = title.slice(0, 80);
      conversation.updatedAt = Date.now();

      saveConversations();
      showToast("Conversation renamed.");
    }

    function deleteAllConversations() {
      conversations = [];
      activeConversationId = null;

      try {
        localStorage.removeItem(getStorageKey());
      } catch (error) {
        console.error(error);
      }

      createConversation();
      showToast("All conversations deleted.");
    }

    /* Sidebar history */

    function renderHistory() {
      historyList.innerHTML = "";

      if (conversations.length === 0) {
        const empty = document.createElement("div");

        empty.textContent = "No conversations yet";
        empty.style.cssText =
          "padding:10px;color:var(--muted);font-size:12px";

        historyList.appendChild(empty);
        return;
      }

      conversations.forEach(conversation => {
        const item = document.createElement("div");

        item.className = "history-item" +
          (conversation.id === activeConversationId ? " active" : "");

        const icon = document.createElement("span");
        icon.className = "history-icon";
        icon.textContent = "▤";

        const title = document.createElement("span");
        title.className = "history-title";
        title.textContent = conversation.title;

        const menuButton = document.createElement("button");
        menuButton.className = "history-menu-btn";
        menuButton.textContent = "⋯";
        menuButton.setAttribute("aria-label", "Conversation options");

        item.append(icon, title, menuButton);

        item.addEventListener("click", event => {
          if (event.target === menuButton) return;
          selectConversation(conversation.id);
        });

        menuButton.addEventListener("click", event => {
          event.stopPropagation();
          openContextMenu(conversation.id, menuButton);
        });

        historyList.appendChild(item);
      });
    }

    function openContextMenu(id, anchor) {
      menuConversationId = id;

      const rect = anchor.getBoundingClientRect();

      contextMenu.style.display = "block";

      const menuWidth = 155;
      const menuHeight = 90;

      let left = rect.right - menuWidth;
      let top = rect.bottom + 5;

      left = Math.max(8, Math.min(left, window.innerWidth - menuWidth - 8));

      if (top + menuHeight > window.innerHeight) {
        top = rect.top - menuHeight - 5;
      }

      contextMenu.style.left = `${left}px`;
      contextMenu.style.top = `${Math.max(8, top)}px`;
    }

    function closeContextMenu() {
      contextMenu.style.display = "none";
    }

    document.addEventListener("click", event => {
      if (!contextMenu.contains(event.target)) {
        closeContextMenu();
      }
    });

    document.getElementById("renameConversationBtn")
      .addEventListener("click", () => {
        closeContextMenu();

        const conversation = conversations.find(
          item => item.id === menuConversationId
        );

        if (!conversation) return;

        showModal({
          title: "Rename conversation",
          description: "Choose a name for this conversation.",
          confirmText: "Save name",
          showInput: true,
          inputValue: conversation.title,
          action: newTitle => {
            renameConversation(menuConversationId, newTitle);
          }
        });
      });

    document.getElementById("deleteConversationBtn")
      .addEventListener("click", () => {
        closeContextMenu();

        const id = menuConversationId;

        showModal({
          title: "Delete conversation?",
          description:
            "This will permanently remove this conversation from the saved history in this browser.",
          confirmText: "Delete",
          action: () => deleteConversation(id)
        });
      });

    /* Modal */

    function showModal(options) {
      modalTitle.textContent = options.title;
      modalDescription.textContent = options.description;
      modalConfirm.textContent = options.confirmText || "Confirm";

      renameInput.style.display = options.showInput ? "block" : "none";
      renameInput.value = options.inputValue || "";

      modalAction = options.action;

      modalOverlay.style.display = "flex";

      if (options.showInput) {
        window.setTimeout(() => {
          renameInput.focus();
          renameInput.select();
        }, 50);
      } else {
        modalConfirm.focus();
      }
    }

    function closeModal() {
      modalOverlay.style.display = "none";
      modalAction = null;
    }

    modalCancel.addEventListener("click", closeModal);

    modalOverlay.addEventListener("click", event => {
      if (event.target === modalOverlay) {
        closeModal();
      }
    });

    modalConfirm.addEventListener("click", () => {
      const action = modalAction;
      const value = renameInput.value;

      closeModal();

      if (typeof action === "function") {
        action(value);
      }
    });

    renameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        modalConfirm.click();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeContextMenu();
        closeModal();
        closeMobileSidebar();
      }
    });

    /* Welcome screen */

    function renderWelcome() {
      chatContent.innerHTML = `
        <div class="welcome">

          <div class="welcome-icon">✦</div>

          <h1>Your ideas, <span>amplified.</span></h1>

          <p>
            Welcome to Nexora AI. Ask questions, explore ideas, write code,
            or get help with your next project.
          </p>

          <div class="suggestions">

            <button class="suggestion" data-prompt="Explain cybersecurity to a beginner and give me a learning roadmap.">
              <span class="suggestion-icon">⌘</span>
              <strong>Learn something new</strong>
              <span>Explore a topic step by step.</span>
            </button>

            <button class="suggestion" data-prompt="Help me write clean, beginner-friendly code. Explain the code line by line.">
              <span class="suggestion-icon">〈/〉</span>
              <strong>Write and explain code</strong>
              <span>Build projects and understand the logic.</span>
            </button>

            <button class="suggestion" data-prompt="Help me brainstorm creative ideas for a modern SaaS business.">
              <span class="suggestion-icon">✧</span>
              <strong>Brainstorm ideas</strong>
              <span>Turn your thoughts into useful plans.</span>
            </button>

            <button class="suggestion" data-prompt="Help me create a practical daily productivity plan for studying and completing projects.">
              <span class="suggestion-icon">◷</span>
              <strong>Plan your day</strong>
              <span>Organize tasks and make progress.</span>
            </button>

          </div>
        </div>
      `;

      chatContent.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          messageInput.value = button.dataset.prompt;
          autoResizeInput();
          sendMessage();
        });
      });
    }

    /* Message formatting */

    function formatInline(text) {
      let safe = escapeHTML(text);

      safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      safe = safe.replace(/\*(.+?)\*/g, "<em>$1</em>");

      return safe;
    }

    function formatPlainText(text) {
      const lines = String(text).split("\n");
      const output = [];

      let paragraph = [];
      let listType = null;
      let listItems = [];

      function flushParagraph() {
        if (paragraph.length) {
          output.push(`<p>${paragraph.map(formatInline).join("<br>")}</p>`);
          paragraph = [];
        }
      }

      function flushList() {
        if (!listItems.length) return;

        const tag = listType === "ordered" ? "ol" : "ul";

        output.push(
          `<${tag}>${listItems.map(item =>
            `<li>${formatInline(item)}</li>`
          ).join("")}</${tag}>`
        );

        listItems = [];
        listType = null;
      }

      for (const line of lines) {
        const trimmed = line.trim();

        if (!trimmed) {
          flushParagraph();
          flushList();
          continue;
        }

        const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);

        if (heading) {
          flushParagraph();
          flushList();

          const level = heading[1].length;

          output.push(
            `<h${level}>${formatInline(heading[2])}</h${level}>`
          );

          continue;
        }

        const unordered = trimmed.match(/^[-*]\s+(.+)$/);
        const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);

        if (unordered || ordered) {
          flushParagraph();

          const nextType = ordered ? "ordered" : "unordered";

          if (listType && listType !== nextType) {
            flushList();
          }

          listType = nextType;
          listItems.push((unordered || ordered)[1]);

          continue;
        }

        flushList();
        paragraph.push(trimmed);
      }

      flushParagraph();
      flushList();

      return output.join("");
    }

    function formatMessage(text) {
      const source = String(text);
      const fencePattern = /```([^\n`]*)\n?([\s\S]*?)```/g;

      let output = "";
      let lastIndex = 0;
      let match;

      while ((match = fencePattern.exec(source)) !== null) {
        const preceding = source.slice(lastIndex, match.index);

        if (preceding) {
          output += formatPlainText(preceding);
        }

        const language = match[1].trim() || "code";
        const code = match[2].replace(/\n$/, "");

        output += `
          <div class="code-block">
            <div class="code-header">
              <span>${escapeHTML(language)}</span>
              <button class="copy-code-btn" type="button">Copy code</button>
            </div>
            <pre><code>${escapeHTML(code)}</code></pre>
          </div>
        `;

        lastIndex = fencePattern.lastIndex;
      }

      const remaining = source.slice(lastIndex);

      if (remaining) {
        output += formatPlainText(remaining);
      }

      return output || "<p></p>";
    }

    /* Render chat */

    function renderChat() {
      const conversation = getActiveConversation();

      chatContent.innerHTML = "";

      if (!conversation || conversation.messages.length === 0) {
        renderWelcome();
        return;
      }

      conversation.messages.forEach(message => {
        appendMessageToDOM(message.role, message.content, message.time, false);
      });

      scrollToBottom();
    }

    function appendMessageToDOM(role, content, time, shouldScroll = true) {
      const isAssistant = role === "assistant";

      const wrapper = document.createElement("div");

      wrapper.className =
        `message ${isAssistant ? "assistant-message" : "user-message"}`;

      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.textContent = isAssistant ? "✦" : "●";

      const body = document.createElement("div");
      body.className = "message-body";

      const heading = document.createElement("div");
      heading.className = "message-heading";

      const name = document.createElement("span");
      name.className = "message-name";
      name.textContent = isAssistant ? "Nexora AI" : "You";

      const timestamp = document.createElement("span");
      timestamp.className = "message-time";
      timestamp.textContent = time || getCurrentTime();

      heading.append(name, timestamp);

      const text = document.createElement("div");
      text.className = "message-text";
      text.innerHTML = formatMessage(content);

      body.append(heading, text);

      if (isAssistant) {
        const actions = document.createElement("div");
        actions.className = "message-actions";

        const copyButton = document.createElement("button");
        copyButton.className = "message-action";
        copyButton.textContent = "▣ Copy response";

        copyButton.addEventListener("click", () => {
          copyText(content);
        });

        actions.appendChild(copyButton);
        body.appendChild(actions);
      }

      wrapper.append(avatar, body);
      chatContent.appendChild(wrapper);

      text.querySelectorAll(".copy-code-btn").forEach(button => {
        button.addEventListener("click", () => {
          const code = button
            .closest(".code-block")
            .querySelector("pre code").textContent;

          copyText(code);
        });
      });

      if (shouldScroll) {
        scrollToBottom();
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      });
    }

    function showTypingIndicator() {
      const wrapper = document.createElement("div");

      wrapper.className = "message assistant-message";
      wrapper.id = "typingIndicator";

      wrapper.innerHTML = `
        <div class="message-avatar">✦</div>
        <div class="message-body">
          <div class="message-heading">
            <span class="message-name">Nexora AI</span>
          </div>
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;

      chatContent.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById("typingIndicator");

      if (indicator) {
        indicator.remove();
      }
    }

    /* Chat API */

    function buildHistory(messages) {
      return messages.map(message => ({
        role: message.role === "assistant" ? "model" : "user",
        parts: [{ text: message.content }],
        content: message.content
      }));
    }

    async function sendMessage() {
      if (isSending) return;

      const message = messageInput.value.trim();

      if (!message) return;

      if (message.length > 12000) {
        showToast("Your message is too long.", "error");
        return;
      }

      let conversation = getActiveConversation();

      if (!conversation) {
        createConversation();
        conversation = getActiveConversation();
      }

      if (!conversation) {
        showToast("Could not create a conversation.", "error");
        return;
      }

      isSending = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;
      modelStatus.textContent = "Generating response...";

      messageInput.value = "";
      autoResizeInput();

      const userMessage = {
        role: "user",
        content: message,
        time: getCurrentTime()
      };

      conversation.messages.push(userMessage);

      if (
        conversation.title === "New conversation" &&
        conversation.messages.length === 1
      ) {
        conversation.title = message.length > 38
          ? message.slice(0, 38).trim() + "…"
          : message;
      }

      conversation.updatedAt = Date.now();

      saveConversations();

      // Display the submitted message immediately.
      if (chatContent.querySelector(".welcome")) {
        chatContent.innerHTML = "";
      }

      appendMessageToDOM("user", message, userMessage.time);
      showTypingIndicator();

      try {
        const history = buildHistory(
          conversation.messages.slice(0, -1)
        );

        const response = await fetch(CHAT_API, {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history
          })
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401 || response.status === 403) {
          removeTypingIndicator();

          showToast("Your login session has expired. Please log in again.", "error");

          window.setTimeout(() => {
            window.location.replace("login.html");
          }, 1200);

          return;
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            `Request failed with status ${response.status}.`
          );
        }

        const reply = data.reply || data.response;

        if (typeof reply !== "string" || !reply.trim()) {
          throw new Error("The AI returned an empty response. Please try again.");
        }

        removeTypingIndicator();

        const assistantMessage = {
          role: "assistant",
          content: reply,
          time: getCurrentTime()
        };

        conversation.messages.push(assistantMessage);
        conversation.messages = conversation.messages.slice(-MAX_MESSAGES);
        conversation.updatedAt = Date.now();

        saveConversations();

        appendMessageToDOM(
          "assistant",
          assistantMessage.content,
          assistantMessage.time
        );

        modelStatus.textContent = "AI assistant ready";

      } catch (error) {
        console.error("Nexora AI request failed:", error);

        removeTypingIndicator();

        const errorMessage =
          "I couldn't generate a response. " +
          (error.message || "Please try again.");

        appendMessageToDOM("assistant", errorMessage, getCurrentTime());

        modelStatus.textContent = "Response failed";

        showToast(
          "AI request failed. Check your backend and Gemini API settings.",
          "error",
          5000
        );

      } finally {
        isSending = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    /* Retry last user message */

    function retryLastMessage() {
      if (isSending) return;

      const conversation = getActiveConversation();

      if (!conversation || conversation.messages.length === 0) {
        showToast("There is no message to retry.", "error");
        return;
      }

      const lastMessage =
        conversation.messages[conversation.messages.length - 1];

      if (lastMessage.role === "assistant") {
        conversation.messages.pop();
      }

      const lastUserMessage =
        conversation.messages[conversation.messages.length - 1];

      if (!lastUserMessage || lastUserMessage.role !== "user") {
        showToast("No user message is available to retry.", "error");
        return;
      }

      const retryText = lastUserMessage.content;

      conversation.messages.pop();
      saveConversations();
      renderChat();

      messageInput.value = retryText;
      sendMessage();
    }

    /* Input events */

    chatForm.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage();
    });

    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    function autoResizeInput() {
      messageInput.style.height = "auto";

      messageInput.style.height =
        Math.min(messageInput.scrollHeight, 180) + "px";
    }

    messageInput.addEventListener("input", autoResizeInput);

    /* New conversations */

    document.getElementById("sidebarNewChat")
      .addEventListener("click", createConversation);

    document.getElementById("topNewChat")
      .addEventListener("click", createConversation);

    /* Delete all */

    document.getElementById("deleteAllBtn")
      .addEventListener("click", () => {
        if (isSending) {
          showToast("Wait for the current response to finish.", "error");
          return;
        }

        if (conversations.length === 0) {
          showToast("There are no conversations to delete.");
          return;
        }

        showModal({
          title: "Delete all conversations?",
          description:
            "This will remove all Nexora AI conversations saved in this browser. This action cannot be undone.",
          confirmText: "Delete all",
          action: deleteAllConversations
        });
      });

    /* Login session */

    async function checkSession() {
      try {
        const response = await fetch(SESSION_API, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        });

        if (response.status === 401 || response.status === 403) {
          window.location.replace("login.html");
          return false;
        }

        if (!response.ok) {
          throw new Error("Session check failed with status " + response.status);
        }

        const data = await response.json();

        if (data.authenticated === false || data.loggedIn === false) {
          window.location.replace("login.html");
          return false;
        }

        currentUser =
          data.user ||
          data.account ||
          data;

        const userName =
          currentUser.name ||
          currentUser.fullName ||
          currentUser.username ||
          currentUser.email ||
          "Nexora User";

        document.getElementById("userName").textContent = userName;

        document.getElementById("userAvatar").textContent =
          userName.trim().charAt(0).toUpperCase() || "N";

        return true;

      } catch (error) {
        console.error("Session check failed:", error);

        chatContent.innerHTML = `
          <div class="welcome">
            <div class="welcome-icon">!</div>
            <h1>Unable to verify your session</h1>
            <p>
              Make sure the Nexora backend is running at
              <strong>http://localhost:3000</strong>.
              Then reload this page.
            </p>
            <button class="btn btn-primary" id="reloadPageBtn">
              Try again
            </button>
            <br>
            <a class="btn" href="login.html">Go to login</a>
          </div>
        `;

        document.getElementById("reloadPageBtn")
          .addEventListener("click", () => {
            window.location.reload();
          });

        return false;
      }
    }

    /* Logout */

    document.getElementById("logoutBtn")
      .addEventListener("click", async () => {
        if (isSending) {
          showToast("Wait for the current response to finish.", "error");
          return;
        }

        try {
          const response = await fetch(LOGOUT_API, {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            }
          });

          if (!response.ok) {
            const data = await response.json().catch(() => ({}));

            throw new Error(
              data.error || data.message || "Could not log out."
            );
          }

          window.location.replace("login.html");

        } catch (error) {
          console.error("Logout failed:", error);

          showToast(
            "Could not log out. Check whether the backend is running.",
            "error",
            5000
          );
        }
      });

    /* Mobile sidebar */

    document.getElementById("mobileMenuBtn")
      .addEventListener("click", openMobileSidebar);

    sidebarBackdrop.addEventListener("click", closeMobileSidebar);

    /* Start application */

    async function initializeApp() {
      const authenticated = await checkSession();

      if (!authenticated) return;

      loadConversations();

      if (conversations.length > 0) {
        activeConversationId = conversations[0].id;
      } else {
        const conversation = {
          id: makeId(),
          title: "New conversation",
          createdAt: Date.now(),
          updatedAt: Date.now(),
          messages: []
        };

        conversations.unshift(conversation);
        activeConversationId = conversation.id;

        saveConversations();
      }

      renderHistory();
      renderChat();
      autoResizeInput();
    }

    initializeApp();
  </script>
</body>
</html>
